# The specifications, checked against Dogwood's own regression corpus on every push.
#
# The name says corpus because that is what makes this more than a compile. The suite builds the
# solution and then runs the specs against 620 policy files and 900-odd recorded (trace, expected)
# pairs from `ext/dogwood` -- the reference implementation's own tests, used as the oracle for
# ours. A green run here is a statement that our reading of the language still agrees with theirs.
#
# EVERY ACTION IS PINNED TO A COMMIT SHA, for the same reason every other dependency here is:
# NuGet by contentHash, pip by --require-hashes, cargo by checksum, ext/dogwood by a SHA verified
# blob-for-blob. `@v7` is a MUTABLE tag -- whoever controls it decides what runs in CI, and CI runs
# on every push to master. The version tag rides in the trailing comment so a reader still knows
# what these are; the SHA is what actually resolves.
#
# TO UPDATE ONE, resolve the tag and take what GitHub returns rather than copying a SHA from a web
# page (a tag may be annotated, in which case `^{}` is the commit and the bare ref is the tag
# object):
#
#     git ls-remote https://github.com/actions/checkout refs/tags/v7.0.1 'refs/tags/v7.0.1^{}'
#
# then change BOTH the SHA and the comment. A stale comment beside a live SHA is worse than no
# comment: it is a claim about what is running that nobody can check by reading.
#
# THE MAJORS are the latest of each, not the minimum that works. Node 20 was deprecated on the
# runners (2025-09-19) and every v4-era action was being forced onto Node 24 with a warning; these
# target it natively. Checked before bumping, because a breaking change here takes the whole
# run out with nothing to bisect: checkout v5-v7 harden `pull_request_target` defaults, which this
# workflow does not use; setup-java v6 removes the legacy `adopt` distributions, and this asks for
# `temurin`; setup-python v7 removes a `pip-install` input this never set; setup-dotnet's wildcard
# restriction applies only alongside `rollForward`, which is likewise unused. They require runner
# 2.327.1 or newer, which GitHub-hosted runners satisfy.
name: Build and corpus test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # LINUX ONLY, and this is a BILLING decision rather than a technical one. GitHub bills
      # Windows runners at twice the rate of Linux ones against a limited monthly allowance, and
      # this suite is not short: the corpus tests dominate it and they are the same work on either
      # OS. The Windows half is run BY HAND on the maintainer's machine, which is a Windows
      # machine, so the coverage is not gone -- it is no longer automatic.
      #
      # WHAT THAT COSTS, stated because it is a real cost and this repo has already paid it once.
      # A Windows-only failure is usually a path or line-ending problem, and `.gitattributes`
      # exists precisely because CRLF on a shebang line got past a Windows developer and failed on
      # a Linux runner -- the same class of bug, caught in the other direction by having both legs.
      # `PythonHarnessAttribute.RequiresExecutable` carries a comment about the same hazard. So a
      # Windows regression will now be found by somebody running the suite rather than by a push.
      #
      # TO PUT IT BACK, uncomment the one line. The Windows-conditional steps below are KEPT for
      # that reason rather than deleted: dead while the matrix has one entry, correct the moment it
      # has two, and a deleted step is a thing somebody has to rewrite from memory.
      fail-fast: false
      matrix:
        os:
          # - windows-latest
          # Pinned to 22.04 to match the solver-builds asset the scripts fetch. The runner version
          # does not change which asset is downloaded, but it does decide what the binary runs on.
          - ubuntu-22.04

    steps:
      # `submodules` is false by default, so without this ext/dogwood is an empty directory and
      # BOTH Dogwood harnesses skip: the corpus is not there for dogwood_differential.py, and
      # neither is the source dogwood_replay.py's binary is built from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # TLC runs out-of-process on a real JVM because it cannot run under IKVM, so the tests need a
      # JDK. The build scripts check for one and fail if it is absent; they never install it.
      - name: Set up the JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '11'

      # lib/ is gitignored, so every run would otherwise re-download ~30 MB. Keyed on the scripts
      # because that is where the versions and hashes live: change a pin and the cache is bypassed.
      - name: Cache native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lib
          key: anchor-lib-${{ runner.os }}-${{ hashFiles('build.ps1', 'build.sh') }}

      # Without this the nine Python harnesses in HarnessTests.cs SKIP, and the run reports green
      # having exercised none of them — the graph translator, every differential test against a
      # real engine, and the vacuity checker. That is the weakest possible signal: a build that
      # passes because it did not look.
      #
      # 3.13 exactly. `check_python.py` asks the venv's own interpreter whether it clears the floor
      # recorded in the lock's header, so an older runner default fails here with that message
      # rather than much later inside pip.
      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      # Keyed on the lock AND the exact interpreter. A venv records the absolute path of the base
      # interpreter it was built from, so a patch bump under setup-python would leave a restored
      # venv pointing at one that is no longer there. Both in the key means that invalidates
      # instead of producing a broken environment that fails somewhere unrelated.
      - name: Cache the Python virtual environment
        id: venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: python
          key: anchor-venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements/strands/requirements.txt') }}

      # The same scripts a person runs, not a reimplementation of them. They enforce
      # --require-hashes (every package, transitive included, matches its recorded digest) and
      # --only-binary=:all: (no sdists, so no setup.py executes during install), and they copy
      # pip.ini into the venv where pip actually reads it. A hand-rolled `pip install` step here
      # would be a second code path that could silently drop one of those.
      - name: Install the Python dependencies (Windows)
        if: runner.os == 'Windows' && steps.venv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m venv python
          ./requirements/strands/install.cmd

      - name: Install the Python dependencies (Linux)
        if: runner.os == 'Linux' && steps.venv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m venv python
          ./requirements/strands/install.sh

      # The Dogwood CLI, for dogwood_replay.py -- the one harness that needs a live engine rather
      # than recorded fixtures. Linux only: `RequiresExecutable` skips the test cleanly, so the
      # Windows leg need not pay for a second Rust build to gain nothing.
      #
      # Keyed on the lockfile and the pinned submodule commit. `git rev-parse HEAD:ext/dogwood`
      # reads the gitlink -- the SHA this repo pins -- so bumping the submodule rebuilds.
      - name: Cache the Dogwood build
        if: runner.os == 'Linux'
        id: dogwood-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ext/dogwood/target
          key: dogwood-${{ runner.os }}-${{ hashFiles('requirements/dogwood/Cargo.lock') }}-${{ hashFiles('.gitmodules') }}

      # NOT continue-on-error, deliberately. It was, briefly, on the reasoning that a runner
      # toolchain problem should not redden an unrelated PR for one test. That is the wrong trade
      # here: `RequiresExecutable` skips the replay harness when the binary is absent, so a failed
      # build would produce "48 passed, 1 skipped" and a GREEN run -- visually identical to the
      # Windows leg, with only an annotation to say the live-engine check had quietly stopped
      # happening. That check is what backs the `error`-event finding in specs/policy/TemporalPolicy.
      #
      # The graceful skip exists for a tree that was never built, not for a build that broke. Same
      # rule as vacuity.py's: never let a failure read as an absence of data.
      - name: Build the Dogwood CLI (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -x
          rustc --version
          cargo --version

          # --locked needs a Cargo.lock at the workspace root, and Dogwood ships none -- which is
          # exactly why `cargo install --git --locked` was not an option here: it would have had
          # nothing to lock against and would have re-resolved from crates.io, discarding the audit
          # recorded in reference/README.md. Ours goes in first.
          cp requirements/dogwood/Cargo.lock ext/dogwood/Cargo.lock

          cargo build --release --locked --manifest-path ext/dogwood/Cargo.toml

          # The lockfile must not have moved. --locked should already guarantee it; checking costs
          # nothing and turns a silent re-resolution into a visible one.
          diff requirements/dogwood/Cargo.lock ext/dogwood/Cargo.lock

          # The `net` feature registers an http_get host function for provider scripts, which would
          # make policy evaluation non-deterministic and network-dependent -- the thing every claim
          # in specs/policy/TemporalPolicy is scoped against. It is off by default and no dependency
          # edge enables it, so this should never fire; it is here because the cost of checking is a
          # grep and the cost of being wrong is every claim in that spec.
          for sym in http_get TcpStream connect_timeout; do
            if grep -qa "$sym" ext/dogwood/target/release/dogwood; then
              echo "::error::'$sym' found in the Dogwood binary - the net feature is compiled in"
              exit 1
            fi
          done
          echo "net feature confirmed absent"

      # CI is set by GitHub, and the scripts turn it into RestoreLockedMode=true, so a restore that
      # would silently re-resolve a committed packages.lock.json fails instead.
      #
      # Expect this to be slow on a cold cache: IKVM cross-compiles tla2tools.jar into an assembly,
      # which dominates a first build.
      # Each OS runs its own script, so whichever legs are enabled get real execution coverage
      # rather than a lint. With the matrix at Linux only, `build.ps1` is exercised by hand and not
      # by a push -- see the note on the matrix above.
      #
      # Two steps rather than one parameterised by the matrix. A step's `shell:` does not accept the
      # `matrix` context — GitHub validates which contexts each key may use, separately from YAML
      # syntax — and `shell: ${{ matrix.shell }}` fails the whole workflow at startup with
      # "Unrecognized named-value: 'matrix'", before any job is created. `run:` does accept it, so
      # the error names only the one line.
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Test

      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./build.sh -c Release -t
